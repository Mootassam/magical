<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estore — Cart</title>
<style>
  :root{
    --navy:#0e1b45;
    --blue-bright:#2f8dff;
    --blue-mid:#1656c9;
    --blue-deep:#0b3fae;
    --white:#ffffff;
    --page-bg:#f4f7fd;
    --card-bg:#ffffff;
    --grey-text:#6b7590;
    --grey-light:#eef2fa;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:#dfe6f5;
    display:flex;
    justify-content:center;
    padding:20px 0;
  }

  .phone{
    width:390px;
    max-width:100%;
    height:844px;
    background:var(--page-bg);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(14,27,69,0.25);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .status-bar{
    background:var(--navy);
    color:#fff;
    font-size:13px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px 6px;
    flex-shrink:0;
  }

  /* ---------- Header ---------- */
  .page-header{
    background:linear-gradient(135deg, var(--blue-deep), var(--blue-bright));
    padding:14px 18px 16px;
    color:#fff;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .page-header .left{ display:flex; align-items:center; gap:10px; }
  .page-header .back{ font-size:18px; }
  .page-header .title{ font-size:18px; font-weight:800; }
  .page-header .edit{ font-size:13px; font-weight:600; opacity:0.9; }

  /* ---------- Scroll body ---------- */
  .scroll-area{
    flex:1;
    overflow-y:auto;
    scrollbar-width:none;
    padding-bottom:8px;
  }
  .scroll-area::-webkit-scrollbar{ display:none; }

  .cart-list{
    margin:14px 14px 0;
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:0 8px 20px rgba(20,40,100,0.06);
    overflow:hidden;
  }

  .cart-item{
    display:flex;
    gap:10px;
    padding:14px;
    border-top:1px solid var(--grey-light);
  }
  .cart-item:first-child{ border-top:none; }

  .checkbox{
    width:19px; height:19px;
    border-radius:6px;
    border:2px solid #cdd6ec;
    flex-shrink:0;
    margin-top:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    color:#fff;
  }
  .checkbox.checked{
    background:linear-gradient(135deg, var(--blue-bright), var(--blue-deep));
    border-color:transparent;
  }

  .item-thumb{
    width:76px; height:76px;
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
  }
  .item-thumb img{ width:100%; height:100%; object-fit:cover; }

  .item-body{ flex:1; min-width:0; }
  .item-name{
    font-size:13px; font-weight:700; color:var(--navy);
  }
  .item-variant{
    font-size:11px; color:var(--grey-text);
    margin-top:4px;
    background:var(--grey-light);
    display:inline-block;
    padding:2px 8px;
    border-radius:6px;
  }

  .item-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
  }

  .price-block{ display:flex; align-items:baseline; gap:6px; }
  .price-now{ font-size:14px; font-weight:800; color:var(--blue-deep); }
  .price-old{ font-size:10.5px; color:#b7c0d8; text-decoration:line-through; }

  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    background:var(--grey-light);
    border-radius:10px;
    overflow:hidden;
  }
  .stepper button{
    width:26px; height:26px;
    border:none;
    background:transparent;
    font-size:15px;
    color:var(--blue-deep);
    font-weight:700;
    cursor:pointer;
  }
  .stepper .qty{
    width:26px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--navy);
  }

  /* ---------- Checkout summary (above tab bar) ---------- */
  .checkout-bar{
    flex-shrink:0;
    background:#fff;
    box-shadow:0 -6px 18px rgba(20,40,100,0.08);
    border-top:1px solid var(--grey-light);
    padding:12px 16px;
    z-index:20;
  }
  .checkout-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .select-all{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--navy); font-weight:600;
  }
  .total-block{ text-align:right; }
  .total-label{ font-size:10.5px; color:var(--grey-text); }
  .total-value{ font-size:17px; font-weight:800; color:var(--blue-deep); }

  .checkout-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:13px;
    background:linear-gradient(135deg, var(--blue-bright), var(--blue-deep));
    color:#fff;
    font-size:15px;
    font-weight:800;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(47,141,255,0.4);
  }

  /* ---------- Fixed bottom nav ---------- */
  .bottom-nav{
    flex-shrink:0;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(20,40,100,0.08);
    border-top:1px solid var(--grey-light);
    z-index:20;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:#a6afc8; font-size:11px; font-weight:600;
    position:relative;
    background:none; border:none;
    padding:2px 10px;
  }
  .nav-item .icon{ font-size:20px; line-height:1; }
  .nav-item.active{ color:var(--blue-deep); }
  .nav-item.active::before{
    content:"";
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:26px; height:3px; border-radius:3px;
    background:linear-gradient(90deg, var(--blue-bright), var(--blue-deep));
  }
  .nav-item .cart-badge{
    position:absolute; top:-4px; right:2px;
    background:#ff4d4f; color:#fff; font-size:9px; font-weight:700;
    width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">📶 🔋</div>
  </div>

  <div class="page-header">
    <div class="left">
      <span class="back">←</span>
      <span class="title">My Cart (2)</span>
    </div>
    <span class="edit">Edit</span>
  </div>

  <div class="scroll-area">
    <div class="cart-list">
      <div class="cart-item">
        <div class="checkbox checked">✓</div>
        <div class="item-thumb"><img src="https://loremflickr.com/200/200/jacket,fashion/all?lock=91" alt="Oversized Jacket"></div>
        <div class="item-body">
          <div class="item-name">Oversized Jacket</div>
          <div class="item-variant">Beige · Size M</div>
          <div class="item-bottom">
            <div class="price-block">
              <span class="price-now">$56</span>
              <span class="price-old">$80</span>
            </div>
            <div class="stepper">
              <button>−</button>
              <span class="qty">1</span>
              <button>+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="cart-item">
        <div class="checkbox checked">✓</div>
        <div class="item-thumb"><img src="https://loremflickr.com/200/200/wristwatch/all?lock=92" alt="Minimal Watch"></div>
        <div class="item-body">
          <div class="item-name">Minimal Watch</div>
          <div class="item-variant">Silver</div>
          <div class="item-bottom">
            <div class="price-block">
              <span class="price-now">$65</span>
            </div>
            <div class="stepper">
              <button>−</button>
              <span class="qty">1</span>
              <button>+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="checkout-bar">
    <div class="checkout-top">
      <div class="select-all">
        <div class="checkbox checked">✓</div>
        <span>Select all (2)</span>
      </div>
      <div class="total-block">
        <div class="total-label">Total</div>
        <div class="total-value">$121.00</div>
      </div>
    </div>
    <button class="checkout-btn">Checkout (2)</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item">
      <span class="icon">🗂️</span>
      <span>Classification</span>
    </button>
    <button class="nav-item active">
      <span class="icon">🛒</span>
      <span class="cart-badge">2</span>
      <span>Cart</span>
    </button>
    <button class="nav-item">
      <span class="icon">👤</span>
      <span>Mine</span>
    </button>
  </div>

</div>

</body>
</html>
