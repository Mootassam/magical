<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estore — My Balance</title>
<style>
  :root{
    --navy:#0e1b45;
    --blue-bright:#2f8dff;
    --blue-mid:#1656c9;
    --blue-deep:#0b3fae;
    --white:#ffffff;
    --page-bg:#f4f7fd;
    --card-bg:#ffffff;
    --grey-text:#6b7590;
    --grey-light:#eef2fa;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:#dfe6f5;
    display:flex;
    justify-content:center;
    padding:20px 0;
  }

  .phone{
    width:390px;
    max-width:100%;
    height:844px;
    background:var(--page-bg);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(14,27,69,0.25);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .status-bar{
    background:var(--navy);
    color:#fff;
    font-size:13px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px 6px;
    flex-shrink:0;
  }

  /* ---------- Header ---------- */
  .page-header{
    background:linear-gradient(135deg, var(--blue-deep), var(--blue-bright));
    padding:14px 18px 16px;
    color:#fff;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    border:none;
    color:#fff;
  }
  .page-title{ font-size:17px; font-weight:800; }

  /* ---------- Scroll body ---------- */
  .scroll-area{
    flex:1;
    overflow-y:auto;
    scrollbar-width:none;
    padding-bottom:20px;
  }
  .scroll-area::-webkit-scrollbar{ display:none; }

  /* ---------- Balance hero card ---------- */
  .balance-card{
    margin:18px 16px 0;
    border-radius:22px;
    padding:22px 20px;
    background:linear-gradient(135deg, #16265c 0%, #1656c9 55%, #2f8dff 100%);
    color:#fff;
    box-shadow:0 16px 36px rgba(20,60,150,0.28);
    position:relative;
    overflow:hidden;
  }
  .balance-card::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .balance-card::before{
    content:"";
    position:absolute;
    right:20px; bottom:-50px;
    width:120px; height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }

  .card-title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
  }
  .card-title{ font-size:14px; font-weight:700; opacity:0.9; }
  .eye-toggle{ font-size:15px; opacity:0.85; cursor:pointer; }

  .balance-split{
    display:flex;
    gap:26px;
    margin-top:18px;
    position:relative;
    z-index:2;
  }
  .balance-block .lbl{ font-size:11.5px; opacity:0.8; }
  .balance-block .val{ font-size:26px; font-weight:800; margin-top:4px; }
  .balance-block.small .val{ font-size:20px; }

  .action-row{
    display:flex;
    gap:12px;
    margin-top:22px;
    position:relative;
    z-index:2;
  }
  .btn{
    flex:1;
    text-align:center;
    padding:12px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{
    background:#fff;
    color:var(--blue-deep);
    box-shadow:0 8px 18px rgba(0,0,0,0.15);
  }
  .btn-outline{
    background:rgba(255,255,255,0.12);
    border:1.5px solid rgba(255,255,255,0.6);
    color:#fff;
  }

  /* ---------- Quick links ---------- */
  .quick-links{
    display:flex;
    justify-content:space-between;
    margin:18px 16px 0;
    background:var(--card-bg);
    border-radius:18px;
    box-shadow:0 8px 20px rgba(20,40,100,0.07);
    padding:16px 8px;
  }
  .ql-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .ql-icon{
    width:42px; height:42px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .ql-label{ font-size:11px; font-weight:600; color:var(--navy); text-align:center; }

  .hint{
    margin:16px 16px 0;
    font-size:11.5px;
    color:var(--grey-text);
    text-align:center;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">📶 🔋</div>
  </div>

  <div class="page-header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <span class="page-title">My Balance</span>
  </div>

  <div class="scroll-area">

    <div class="balance-card">
      <div class="card-title-row">
        <span class="card-title">Total Balance</span>
        <span class="eye-toggle">👁</span>
      </div>

      <div class="balance-split">
        <div class="balance-block">
          <div class="lbl">Account Balance</div>
          <div class="val">$0.00</div>
        </div>
        <div class="balance-block">
          <div class="lbl">Available balance</div>
          <div class="val">$0.00</div>
        </div>
      </div>

      <div class="action-row">
        <div class="btn btn-primary">⬆ Top up</div>
        <div class="btn btn-outline">⬇ Withdrawal</div>
      </div>
    </div>

    <div class="quick-links">
      <div class="ql-item">
        <div class="ql-icon" style="background:#eafaf1;">🧾</div>
        <div class="ql-label">Recharge<br>record</div>
      </div>
      <div class="ql-item">
        <div class="ql-icon" style="background:#fff3e6;">📤</div>
        <div class="ql-label">Withdrawals<br>record</div>
      </div>
      <div class="ql-item">
        <div class="ql-icon" style="background:#f1edfd;">👛</div>
        <div class="ql-label">Wallet<br>management</div>
      </div>
      <div class="ql-item">
        <div class="ql-icon" style="background:#e8f1ff;">💳</div>
        <div class="ql-label">Bank card<br>management</div>
      </div>
    </div>

    <div class="hint">Available balance can be used for purchases and withdrawn to your linked bank account.</div>

  </div>

</div>

</body>
</html>
