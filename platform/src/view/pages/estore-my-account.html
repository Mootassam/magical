<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estore — My Account</title>
<style>
  :root{
    --navy:#0e1b45;
    --blue-bright:#2f8dff;
    --blue-mid:#1656c9;
    --blue-deep:#0b3fae;
    --white:#ffffff;
    --page-bg:#f4f7fd;
    --card-bg:#ffffff;
    --grey-text:#6b7590;
    --grey-light:#eef2fa;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:#dfe6f5;
    display:flex;
    justify-content:center;
    padding:20px 0;
  }

  .phone{
    width:390px;
    max-width:100%;
    height:844px;
    background:var(--page-bg);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(14,27,69,0.25);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .status-bar{
    background:var(--navy);
    color:#fff;
    font-size:13px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px 6px;
    flex-shrink:0;
  }

  /* ---------- Header ---------- */
  .page-header{
    background:linear-gradient(135deg, var(--blue-deep), var(--blue-bright));
    padding:14px 18px 16px;
    color:#fff;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
    border:none;
    color:#fff;
  }
  .page-title{ font-size:17px; font-weight:800; }

  /* ---------- Scroll body ---------- */
  .scroll-area{
    flex:1;
    overflow-y:auto;
    scrollbar-width:none;
    padding-bottom:20px;
  }
  .scroll-area::-webkit-scrollbar{ display:none; }

  .account-card{
    background:var(--card-bg);
    margin:16px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(20,40,100,0.07);
    overflow:hidden;
  }

  .account-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-top:1px solid var(--grey-light);
  }
  .account-row:first-child{ border-top:none; }

  .row-left{ display:flex; flex-direction:column; gap:4px; }
  .row-label{ font-size:11.5px; color:var(--grey-text); }
  .row-value{ font-size:14px; font-weight:700; color:var(--navy); }

  .row-action{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:13px;
    font-weight:700;
    color:var(--blue-mid);
  }
  .row-action .chev{ font-size:13px; color:#9fb3e0; }

  .hint{
    margin:14px 16px 0;
    font-size:11.5px;
    color:var(--grey-text);
    text-align:center;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="icons">📶 🔋</div>
  </div>

  <div class="page-header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <span class="page-title">My account</span>
  </div>

  <div class="scroll-area">
    <div class="account-card">

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">Username</span>
          <span class="row-value">kelvin_Rouge</span>
        </div>
      </div>

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">ID</span>
          <span class="row-value">61909941</span>
        </div>
      </div>

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">Phone number</span>
          <span class="row-value">74****74</span>
        </div>
        <div class="row-action">To modify <span class="chev">›</span></div>
      </div>

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">Mail</span>
          <span class="row-value">Not bound</span>
        </div>
        <div class="row-action">Go to binding <span class="chev">›</span></div>
      </div>

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">Login password</span>
          <span class="row-value">••••••</span>
        </div>
        <div class="row-action">To modify <span class="chev">›</span></div>
      </div>

      <div class="account-row">
        <div class="row-left">
          <span class="row-label">Transaction password</span>
          <span class="row-value">••••••</span>
        </div>
        <div class="row-action">To modify <span class="chev">›</span></div>
      </div>

    </div>

    <div class="hint">Keep your account secure — never share your password or verification codes with anyone.</div>
  </div>

</div>

</body>
</html>
